about_content: | # this will include new lines to allow paragraphs

    Hi, I'm Yen-Hsiang (Robert) Huang, a Ph.D. student in Electrical and Computer Engineering at Georgia Tech and a graduate research assistant in the [GTCAD Lab](https://www.gtcad.ece.gatech.edu), advised by [Prof. Sung Kyu Lim](http://limsk.ece.gatech.edu).
    My research focuses on electronic design automation, physical design, 3D integrated circuits, differentiable optimization, and hardware synthesis and verification.

    My current work includes 3D IC optimization, differentiable clock-tree optimization, cross-tier logic-path snaking, 3D-via reduction, and inter-die cell relocation.
    I earned my B.S. in Electrical Engineering from National Taiwan University in 2022.

