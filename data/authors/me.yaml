bio: |
  Yen-Hsiang (Robert) Huang is a Ph.D. Student in Electrical and Computer Engineering at the [Georgia Institute of Technology](https://www.gatech.edu/) and a graduate research assistant with [SCCAD (former GTCAD)](https://sites.usc.edu/sccad/), advised by [Prof. Sung Kyu Lim](https://sites.usc.edu/limsk/).

  His research focuses on electronic design automation, physical design, 3D integrated circuits, differentiable optimization, and hardware synthesis and verification. Contact: [yhhuang@gatech.edu](mailto:yhhuang@gatech.edu).

