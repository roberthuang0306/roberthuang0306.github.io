experience:
  - role: Graduate Research Assistant
    org: SCCAD (former GTCAD), Georgia Institute of Technology
    start: 2022-09-01
    summary: |
      - 3D IC optimization through 3D-via reduction and inter-die cell relocation for timing improvement.
      - SRC JUMP 2.0 CHIMES: reduced legacy-node 3D IC WNS by 50–93% compared with the state of the art, achieving 87.9–97.7% of advanced-node 2D performance.
      - Die bonding bumps and pads legalization: developed a 3D-via legalization stage with refinement and eliminated all 3D-via overlaps below 40% via utilization.

  - role: R&D Engineer
    org: Synopsys Inc., Synopsys Headquarters
    start: 2025-05-01
    end: 2025-12-31
    summary: |
      - Researched machine-learning-based signal-integrity analysis for 2.5D ICs, evaluating multiple models to predict final-stage SI performance from early-stage design data.
      - Independently implemented two provided prototypes in C++ and merged the resulting code into the main branch.

  - role: Individual Study on Physical Design
    org: EDA Lab., National Taiwan University
    start: 2020-04-01
    end: 2021-09-30
    summary: Participated in three physical-design global contests and placed in the top five twice, including ISPD 2021 and ICCAD 2021.

  - role: Individual Study on Reversible Circuit Synthesis
    org: ALCom Lab., National Taiwan University
    start: 2020-09-01
    end: 2021-06-30
    summary: Implemented a reversible circuit synthesizer for controlled-NOT (CNOT) gates.

  - role: Software Engineer R&D Intern
    org: Synopsys Inc., Concurrent Clock-and-Data (CCD) Team
    start: 2021-07-01
    end: 2021-08-31
    summary: |
      - Enhanced the flip-flop merging algorithm in Synopsys IC Compiler II by considering flip-flop timing slack.
      - Improved timing quality across 13 industrial benchmarks, achieving 5.14%/3.47% improvements in worst/total negative slack.

  - role: Software Engineer R&D Intern
    org: Cadence Inc., Conformal Team
    start: 2020-06-01
    end: 2020-09-30
    summary: |
      - Developed electronic change-order test cases as part of a five-person team for Cadence Conformal robustness testing.
      - Generated more than 2,000 cases across five categories in which Conformal behaved unusually and proposed three improved flows to address them.

